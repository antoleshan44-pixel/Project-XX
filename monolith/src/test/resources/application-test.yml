server:
  port: 0

spring:
  application:
    name: urbano-monolith-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cache:
    type: none
  datasource:
    url: jdbc:h2:mem:urbano_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false

jwt:
  secret: very-secret-test-jwt-key-that-is-at-least-256-bits-long-for-hmac-sha
  access-expiry: 3600
  refresh-expiry: 86400
  issuer: urbano-homes-test
