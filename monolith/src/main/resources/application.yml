server:
  port: 8080

spring:
  application:
    name: urbano-monolith
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:urbano_homes}
    username: ${DB_USER:urbano}
    password: ${DB_PASSWORD:urbano_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  thymeleaf:
    check-template-location: false

logging:
  level:
    com.urbano: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:change_me_in_production}
  access-expiry: 900
  refresh-expiry: 604800
  issuer: urbano-homes