server:
  port: ${PORT:9090}

spring:
  application:
    name: urbano-monolith
  datasource:
    url: jdbc:postgresql://${DB_HOST:urbano-postgres-happy-stays1.e.aivencloud.com}:${DB_PORT:15692}/${DB_NAME:defaultdb}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USER:avnadmin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
  data:
    redis:
      host: ${REDIS_HOST:urbano-valkey-happy-stays1.h.aivencloud.com}
      port: ${REDIS_PORT:15693}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:true}
      timeout: 5000ms
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 2000ms
          time-between-eviction-runs: 30s
        shutdown-timeout: 200ms
  thymeleaf:
    check-template-location: false

logging:
  level:
    com.urbano: INFO
    # Silence the noisy Lettuce reconnect chatter when Aiven's managed Valkey
    # closes idle connections every ~5 minutes. Lettuce reconnects transparently,
    # so the logs are just noise.
    io.lettuce.core.protocol.ConnectionWatchdog: WARN
    io.lettuce.core.protocol.ReconnectionHandler: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
  access-expiry: 900
  refresh-expiry: 604800
  issuer: urbano-homes